name: Build and publish Docker image

on:
  workflow_dispatch:
  schedule:
    # Montags 04:00 UTC: baut den dann aktuellen Upstream-Release neu
    - cron: '0 4 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest upstream release tag
        id: upstream
        run: |
          TAG=$(curl -s https://api.github.com/repos/trash-panda-v91-beta/donetick-mcp/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Bewusst der Upstream und nicht der Fork-Inhalt, damit dieser Fork
      # reine Build-Werkstatt bleibt und nie manuell nachgezogen werden muss.
      - name: Checkout upstream release
        uses: actions/checkout@v4
        with:
          repository: trash-panda-v91-beta/donetick-mcp
          ref: ${{ steps.upstream.outputs.tag }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Nur amd64: Ziel ist die Synology, ein arm64-Build wuerde nur Zeit kosten.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/donetick-mcp:latest
            ghcr.io/${{ github.repository_owner }}/donetick-mcp:${{ steps.upstream.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
